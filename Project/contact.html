<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhalia's Bakery | Contact us</title>
    <meta name="author" content="Caden Watts">
    <meta name="description" content="A webpage dedicated to explaing what pastries are offered by Dhalia's bakery, a homebased bakery that provides quality baked goods such as cookies, brownies, and cakes.">
    <link rel="stylesheet" href="styles/siteplan.css">
    <link rel="stylesheet" href="styles/siteplan-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Tinos:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <script src="scripts/main.js" defer></script>
</head>
<body class="contact">
    <header class="site-header" role="banner">
        <div class="brand-logo">
            <img src="images/dhalia-logo.jpeg" alt="Dhalia's Bakery logo" class="logo">
            <div>
                <h1 class="site-title">Dhalia's Bakery</h1>
                <p class="tag">Menu & Specials</p>
            </div>
        </div>
        <nav class="main-nav" role="navigation">
            <button id="menu-toggle"></button>
            <ul id="primary-nav" class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="review.html">Submit Review</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h2 id="contact-heading">Contact & Newsletter</h2>
            <p>If you'd like to receive updates about seasonal items and notices, sign up below.</p>
            
            <form id="newsletter-form" class="form" name="newsletter">
                <div class="form-row">
                    <label for="fullname">Full name</label>
                    <input id="fullname" name="fullname" type="text" required>
                </div>
                <div class="form-row">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="form-row">
                    <input id="consent" name="consent" type="checkbox" required>
                    <label for="consent">I agree to receive emails from Dhalia's Bakery.</label>
                </div>

                <div class="form-row">
                    <button type="submit" class="cta">Subscribe</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2 id="saved-heading">Saved signups</h2>
            <div id=saved-list>

            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p><a href="contact.html">Contact / Newsletter</a> • <a href="menu.html">Full Menu</a> • <a href="review.html">Leave a Review</a></p>
        <div class="footer inner">
            <p>©️<span id="currentYear"></span> Caden Watts Lima, Peru</p>
            <p>Last Modified: <span id="lastModified"></span></p>
        </div>
    </footer>
</body>
</html>
